<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>watch -- gates and sessions</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <span class="logo">watch<span class="logo-dot">.</span></span>
  <nav class="tabs">
    <button class="tab active" data-view="dashboard">Dashboard</button>
    <button class="tab" data-view="sessions">Sessions</button>
  </nav>
  <div class="filters" id="filters">
    <button class="filter active" data-days="7">7<span class="dl"> days</span></button>
    <button class="filter" data-days="30">30<span class="dl"> days</span></button>
    <button class="filter" data-days="90">90<span class="dl"> days</span></button>
  </div>
</header>

<main id="view-dashboard" class="view">
  <section class="tiles" id="tiles"></section>
  <section class="two-charts">
    <figure class="card">
      <figcaption>
        <h2>Sessions per day</h2>
        <p class="subtitle">started inside the window</p>
      </figcaption>
      <div class="chart" id="chart-sessions" role="img" aria-label="Bars: sessions per day"></div>
      <details class="table-fold"><summary>Show as a table</summary>
        <table id="table-sessions-day"></table></details>
    </figure>
    <figure class="card">
      <figcaption>
        <h2>Blocks per day</h2>
        <p class="subtitle">block and deny results from the gates</p>
      </figcaption>
      <div class="chart" id="chart-blocks" role="img" aria-label="Bars: blocks per day"></div>
      <details class="table-fold"><summary>Show as a table</summary>
        <table id="table-blocks-day"></table></details>
    </figure>
  </section>
  <section class="card">
    <figcaption><h2>Gates: which one bites, and on what</h2>
      <p class="subtitle">hook x result inside the window</p></figcaption>
    <table class="table-hooks" id="table-hooks"></table>
  </section>
</main>

<main id="view-sessions" class="view hidden">
  <section class="card">
    <table class="table-sessions" id="table-session-list"></table>
  </section>
</main>

<main id="view-trajectory" class="view hidden">
  <section class="card">
    <div class="traj-head">
      <button id="traj-back" class="filter">Back to sessions</button>
      <h2 id="traj-title"></h2>
      <div id="traj-meta" class="subtitle"></div>
      <button id="traj-analyze" class="btn-analyze">Analyze</button>
    </div>
    <div id="traj-analysis"></div>
    <div id="traj-gates"></div>
    <div id="traj-thread"></div>
    <div class="traj-pages" id="traj-pages"></div>
  </section>
</main>

<div id="tooltip" class="tooltip hidden" role="status"></div>
<script src="/static/app.js"></script>
</body>
</html>
