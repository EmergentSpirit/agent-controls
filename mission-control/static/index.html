<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mission control -- the fleet</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <span class="logo">mission control<span class="logo-dot">.</span></span>
  <nav class="tabs">
    <button class="tab active" data-view="overview">Overview</button>
    <button class="tab" data-view="agents">Agents</button>
    <button class="tab" data-view="schedule">Schedule</button>
    <button class="tab" data-view="logs">Logs</button>
    <button class="tab" data-view="approvals">Approvals</button>
  </nav>
  <div class="topbar-right">
    <span class="stamp" id="stamp"></span>
    <button class="ghost" id="btn-ingest" title="Re-read the journals into the panel database">Re-read journals</button>
  </div>
</header>

<main id="view-overview" class="view">
  <section class="tiles" id="tiles"></section>
  <section class="card">
    <figcaption><h2>Recent events</h2>
      <p class="subtitle">newest first, across every role</p></figcaption>
    <table class="table-events" id="table-recent"></table>
  </section>
</main>

<main id="view-agents" class="view hidden">
  <section class="card">
    <figcaption><h2>Roles, live</h2>
      <p class="subtitle" id="fleet-summary"></p></figcaption>
    <table class="table-fleet" id="table-fleet"></table>
  </section>
</main>

<main id="view-schedule" class="view hidden">
  <section class="card">
    <figcaption><h2>Timers</h2>
      <p class="subtitle">what the user manager will start without you</p></figcaption>
    <table class="table-schedule" id="table-timers"></table>
  </section>
  <section class="card">
    <figcaption><h2>Crontab</h2>
      <p class="subtitle">the older half of the same question</p></figcaption>
    <table class="table-schedule" id="table-crons"></table>
  </section>
</main>

<main id="view-logs" class="view hidden">
  <section class="card">
    <form class="filters-row" id="log-filters">
      <input id="f-agent" type="text" placeholder="role" autocomplete="off">
      <input id="f-project" type="text" placeholder="project" autocomplete="off">
      <select id="f-type"><option value="">every kind</option></select>
      <input id="f-search" type="text" placeholder="search the summary" autocomplete="off">
      <button class="ghost" type="submit">Apply</button>
      <label class="check"><input type="checkbox" id="f-tail" checked> follow</label>
    </form>
    <table class="table-events" id="table-logs"></table>
  </section>
</main>

<main id="view-approvals" class="view hidden">
  <section class="card">
    <figcaption><h2>Waiting for a decision</h2>
      <p class="subtitle" id="approvals-note">The execution engine stopped and
        asked. Read what the operation does before answering.</p></figcaption>
    <div id="approvals-list"></div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
